[package]
name = "binary_compat_macros"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Derive and test macros for binary_compat"

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "proc-macro"] }
