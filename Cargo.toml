[package]
name = "binary_compat"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic tests for binary serialization and deserialization compatibility"

[workspace]
members = ["binary_compat_macros"]

[features]
default = []
macros = ["dep:binary_compat_macros"]
compat-tests = ["macros"]
bincode = ["bincode2"]
bincode1 = ["dep:bincode1", "dep:serde", "macros"]
bincode2 = ["dep:bincode", "macros"]
wincode = ["dep:wincode", "macros"]
fixtures = ["dep:serde", "dep:serde_json", "macros"]

[dependencies]
bincode = { version = "2.0.1", optional = true }
bincode1 = { package = "bincode", version = "1.3", optional = true }
binary_compat_macros = { version = "0.1.0", path = "binary_compat_macros", optional = true }
hex = "0.4"
rand_chacha = "0.9"
rand_core = "0.9"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = "0.10"
wincode = { version = "0.5.3", optional = true, features = ["derive"] }

[dev-dependencies]
trybuild = "1"
